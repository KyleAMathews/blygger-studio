name: Check
# Jobs run in parallel. A pull request runs e2e and the mutation suites only
# where its changed files reach them (scripts/ci-scope.ts says why and how);
# a push to main, or a manual run, runs everything, and Release requires that
# run to be green. A newer push to the same pull request cancels the older run;
# every push to main gets its own group, because GitHub keeps one pending run
# per group and cancels the rest, which would leave a tagged commit unchecked
# and fail its Release.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  oauth-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.5.0
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm install --prefix build/oauth-inspector --no-audit --no-fund @modelcontextprotocol/inspector@2.10.1
      - uses: ./.github/actions/install-chromium
      - run: docker compose -p oauth-conformance -f scripts/oauth-conformance.compose.yml up -d
      - run: npm run test:oauth:interop
      - run: npm run test:oauth:conformance
      - if: always()
        run: docker compose -p oauth-conformance -f scripts/oauth-conformance.compose.yml down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oauth-interop-evidence
          path: |
            build/oauth-interop-results.json
            build/oidc-conformance-results.json
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.scope.outputs.e2e }}
      mutations: ${{ steps.scope.outputs.mutations }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - id: scope
        run: node scripts/ci-scope.ts "${{ github.event_name }}" "${{ github.base_ref }}"
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run lint:oracles
      - run: npm run check:oracle-migration
      - run: npm run check:template
      - run: npm run check:fixtures
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run openapi && git diff --exit-code -- openapi.json
      - run: npm run test:ui -- --maxWorkers=2
      # npm ci already built the same inputs in postinstall.
      - run: npm --ignore-scripts test -- --maxWorkers=2
      - run: npm run test:upgrade
  release-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - id: install
        run: npm ci --legacy-peer-deps
      - run: npm run release:build
      # verify-sdk-consumer.ts, inside release:verify, drives Chromium.
      - uses: ./.github/actions/install-chromium
      - run: npm run release:verify
      # Generate last so release verification reads the checked-in SDK.
      - name: Verify SDK generation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run sdk:generate
          git diff --exit-code -- openapi.json sdk/generated sdk/generation.json
  studio-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      # Node 22.18's node:sqlite truncates text at NUL.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run test:oracles:studio -- --contexts 4
  worker-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run test:oracles:conditional:worker
      - run: npm run test:oracles:contracts
      - run: npm run test:oracles:search
      - run: npm run test:oracles:runtime
  worker-oracle-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run test:oracles:worker
  formatting-baseline:
    uses: ./.github/workflows/formatting-baseline.yml
    with:
      # Preserve the existing Check ceiling pending complete measurement.
      timeout-minutes: 360
  formatting-oracles:
    if: always()
    needs: formatting-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the complete formatting baseline aggregate
        env:
          FORMATTING_RESULT: ${{ needs.formatting-baseline.result }}
        run: test "$FORMATTING_RESULT" = success

  e2e:
    needs: scope
    if: needs.scope.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --legacy-peer-deps
      - uses: ./.github/actions/install-chromium
      - run: npm run test:e2e -- --project=desktop --project=mobile --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-evidence-${{ matrix.shard }}
          path: test-results/

  browser-oracles:
    needs: scope
    if: needs.scope.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --legacy-peer-deps
      - uses: ./.github/actions/install-chromium
      - run: npm run test:oracles:browser
      - run: npm run test:oracles:browser:search

  e2e-webkit:
    needs: scope
    if: needs.scope.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Use Playwright's preinstalled WebKit system dependencies.
    container: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install webkit
      - run: npm run test:e2e -- --project=mobile-webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-webkit-failure-evidence
          path: test-results/
  mutations:
    needs: scope
    if: needs.scope.outputs.mutations != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.scope.outputs.mutations) }}
    name: mutations (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --legacy-peer-deps
      - if: matrix.suite == 'auth-security-browser'
        uses: ./.github/actions/install-chromium
      - name: Run ${{ matrix.suite }} mutants
        env:
          MUTATION_SUITE: ${{ matrix.suite }}
        run: |
          case "$MUTATION_SUITE" in
            oracle) npm run test:mutations ;;
            polling-cache) npm run test:polling-cache:mutations ;;
            auth-security-worker-*) npm run test:auth:security:mutations -- "--worker-shard=${MUTATION_SUITE#auth-security-worker-}" ;;
            auth-security-browser) npm run test:auth:security:mutations -- --browser ;;
            *) echo "unknown suite $MUTATION_SUITE" >&2; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mutation-evidence-${{ matrix.suite }}
          path: |
            test-results/
            build/mutation-*.log
            build/polling-mutation-*.log
            build/security-mutant-*.log
